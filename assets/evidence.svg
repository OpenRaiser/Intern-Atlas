<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300"><title>Example annotation of a source passage from the ResNet abstract</title><rect width="1080" height="300" fill="#ffffff"/><text x="50" y="78" font-family="Georgia,serif" font-size="23" fill="#426e5f" text-anchor="start" font-style="italic">ResNet  ·  He et al., 2015</text><path d="M50 108 H1030" stroke="#c9c9ba" stroke-width="1" stroke-dasharray="none" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="165" font-family="Georgia,serif" font-size="37" fill="#26392f" text-anchor="start" font-style="normal">“Deeper neural networks are</text><text x="49" y="214" font-family="Georgia,serif" font-size="37" fill="#26392f" text-anchor="start" font-style="normal">more difficult to train.”</text><path d="M54 223 Q208 226 370 222" stroke="#9b432f" stroke-width="2" stroke-dasharray="none" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M424 209 C525 209 539 161 595 161" stroke="#c9c9ba" stroke-width="1.5" stroke-dasharray="none" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="595" cy="161" r="3" fill="#ffffff" stroke="#9b432f" stroke-width="2.5"/><text x="617" y="152" font-family="Georgia,serif" font-size="18" fill="#9b432f" text-anchor="start" font-style="italic">Bottleneck</text><text x="617" y="183" font-family="Georgia,serif" font-size="25" fill="#26392f" text-anchor="start" font-style="normal">Optimizing deeper networks</text><text x="617" y="230" font-family="Georgia,serif" font-size="18" fill="#426e5f" text-anchor="start" font-style="italic">Mechanism</text><text x="617" y="260" font-family="Georgia,serif" font-size="25" fill="#26392f" text-anchor="start" font-style="normal">Learn a residual mapping</text></svg>